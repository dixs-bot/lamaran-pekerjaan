<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>H4ckLab Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; background:#020617; color:#22c55e; font-family: monospace; }
    .wrap { max-width:900px; margin:20px auto; padding:16px; }
    .frame { border-radius:8px; border:1px solid #16a34a; padding:10px; background:#020617; box-shadow:0 0 20px rgba(34,197,94,.3); }
    .top { display:flex; justify-content:space-between; margin-bottom:8px; color:#bbf7d0; font-size:12px; }
    .dots { display:flex; gap:4px; }
    .dot { width:9px; height:9px; border-radius:999px; }
    .red{background:#ef4444;} .yellow{background:#eab308;} .green{background:#22c55e;}
    .screen { border-radius:4px; border:1px solid #16a34a44; padding:8px; font-size:13px; min-height:180px; }
    .line { margin-bottom:3px; }
    .prompt { color:#22c55e; }
    .cursor { display:inline-block; width:8px; height:12px; background:#22c55e; animation:blink 1s infinite; vertical-align:bottom; }
    @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="frame">
      <div class="top">
        <div class="dots">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <div>h4cklab@cortex: ~</div>
      </div>
      <div class="screen">
        <div class="line"><span class="prompt">h4cklab@cortex:~$</span> nmap 10.0.0.15</div>
        <div class="line">Scanning 10.0.0.15 ... open ports: 22, 80, 443</div>
        <div class="line"><span class="prompt">h4cklab@cortex:~$</span> ssh root@10.0.0.15</div>
        <div class="line">[connected] mock secure shell session</div>
        <div class="line"><span class="prompt">root@target:~#</span> ./run_audit</div>
        <div class="line">[ok] simulated security audit running ...</div>
        <div class="line"><span class="prompt">root@target:~#</span> <span class="cursor"></span></div>
      </div>
    </div>
  </div>
</body>
</html>
